# Public entry point for the Cloudflare tunnel. Only the LendLoop webhook is
# forwarded to n8n; the editor UI, REST API and every other path stay private.
server {
  listen 8080;
  client_max_body_size 32k;

  # Re-resolve n8n via Docker DNS so restarts of the n8n container don't cause 502s.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $n8n_upstream http://n8n:5678;

  location = /webhook/lendloop-request-events {
    limit_except POST { deny all; }
    proxy_pass $n8n_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }

  location / {
    return 404;
  }
}
