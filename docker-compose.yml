# Local n8n for LendLoop.
#   cp n8n/.env.example n8n/.env        # fill in secrets
#   docker compose run --rm n8n-import  # one-time: import the 3 workflows
#   docker compose up -d n8n            # UI at http://localhost:5678
#
# Convex cloud can't reach localhost, so expose ONLY the webhook path publicly:
#   docker compose --profile tunnel up -d
#   docker compose logs tunnel | grep trycloudflare.com   # public URL (changes on restart)
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file: n8n/.env
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - TZ=${GENERIC_TIMEZONE:-UTC}
      # Code nodes read LENDLOOP_* from the environment and use node:crypto for HMAC.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      # Keep failed executions for debugging; prune old ones.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - N8N_DIAGNOSTICS_ENABLED=false
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach local Convex on Linux too
    volumes:
      - n8n_data:/home/node/.n8n

  # One-shot importer (doesn't start with `up`). Re-running overwrites workflows by id.
  # Also creates a placeholder "LendLoop SMTP" credential if none exists yet, because
  # n8n refuses to publish workflows that reference a missing credential.
  n8n-import:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    profiles: ["tools"]
    env_file: n8n/.env
    entrypoint:
      - sh
      - -c
      - >-
        n8n import:workflow --separate --input=/workflows &&
        (n8n export:credentials --id=lendloopSmtp0001 --output=/tmp/existing.json >/dev/null 2>&1 && echo "SMTP credential exists, keeping it" ||
        (node /scripts/smtp-credential.js --placeholder > /tmp/smtp.json && n8n import:credentials --input=/tmp/smtp.json && echo "Created placeholder SMTP credential"));
        rc=$$?; rm -f /tmp/smtp.json /tmp/existing.json; exit $$rc
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./n8n/scripts/smtp-credential.js:/scripts/smtp-credential.js:ro

  # Allow-lists the single webhook path; everything else returns 404.
  webhook-proxy:
    image: nginx:1.27-alpine
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on: [n8n]
    volumes:
      - ./n8n/webhook-proxy.conf:/etc/nginx/conf.d/default.conf:ro

  # Cloudflare quick tunnel (no account needed) -> webhook-proxy.
  # For a stable URL, use a named tunnel with a token instead.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on: [webhook-proxy]
    command: tunnel --no-autoupdate --url http://webhook-proxy:8080

  # One-shot: store the SMTP login from n8n/smtp.env as the encrypted "LendLoop SMTP"
  # credential. smtp.env is only given to this container, never to the running n8n.
  n8n-smtp:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    profiles: ["tools"]
    env_file: [n8n/.env, n8n/smtp.env]
    entrypoint:
      - sh
      - -c
      - node /scripts/smtp-credential.js > /tmp/smtp.json && n8n import:credentials --input=/tmp/smtp.json; rc=$$?; rm -f /tmp/smtp.json; exit $$rc
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/scripts/smtp-credential.js:/scripts/smtp-credential.js:ro

volumes:
  n8n_data:
